<div class="min-h-screen flex">

  <!-- ── LEFT PANEL ───────────────────────────────────────────────── -->
  <div class="hidden lg:flex w-1/2 bg-gradient-to-br from-emerald-600 to-emerald-900 flex-col items-center justify-center p-12 text-white">
    <span class="text-4xl font-bold tracking-tight">SnapSalon</span>
    <p class="text-emerald-100 text-xl mt-4">Your beauty, your schedule.</p>

    <ul class="mt-10 flex flex-col gap-5 text-base list-none p-0 m-0">
      <li class="flex items-center gap-3">
        <i class="pi pi-check-circle text-emerald-300 text-xl"></i>
        <span>500+ verified salons</span>
      </li>
      <li class="flex items-center gap-3">
        <i class="pi pi-check-circle text-emerald-300 text-xl"></i>
        <span>Instant booking</span>
      </li>
      <li class="flex items-center gap-3">
        <i class="pi pi-check-circle text-emerald-300 text-xl"></i>
        <span>Free cancellation</span>
      </li>
    </ul>
  </div>

  <!-- ── RIGHT PANEL ──────────────────────────────────────────────── -->
  <div class="flex-1 flex items-center justify-center p-8 bg-zinc-50 dark:bg-zinc-950">
    <div class="w-full max-w-md">

      <h2 class="text-2xl font-bold text-zinc-900 dark:text-zinc-100 m-0">Create your account</h2>
      <p class="text-zinc-500 mt-1 mb-8">Join SnapSalon — it's free.</p>

      <!-- Error banner -->
      @if (errorMessage()) {
        <div class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-6 text-sm" role="alert">
          <i class="pi pi-exclamation-circle shrink-0"></i>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="flex flex-col gap-6">

        <!-- Full Name -->
        <p-floatlabel variant="on">
          <input
            pInputText
            id="reg-fullname"
            formControlName="fullName"
            autocomplete="name"
            class="w-full"
            [class.ng-invalid]="fullName.invalid && fullName.touched"
            [class.ng-dirty]="fullName.touched"
          />
          <label for="reg-fullname">Full Name</label>
        </p-floatlabel>

        <!-- Email -->
        <p-floatlabel variant="on">
          <input
            pInputText
            id="reg-email"
            type="email"
            formControlName="email"
            autocomplete="email"
            class="w-full"
            [class.ng-invalid]="email.invalid && email.touched"
            [class.ng-dirty]="email.touched"
          />
          <label for="reg-email">Email</label>
        </p-floatlabel>

        <!-- Password -->
        <p-floatlabel variant="on">
          <p-password
            inputId="reg-password"
            formControlName="password"
            [feedback]="true"
            [toggleMask]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
            autocomplete="new-password"
            [class.ng-invalid]="password.invalid && password.touched"
            [class.ng-dirty]="password.touched"
          />
          <label for="reg-password">Password</label>
        </p-floatlabel>

        <!-- Account type -->
        <p-selectButton
          [(ngModel)]="accountType"
          [ngModelOptions]="{ standalone: true }"
          [options]="accountTypeOptions"
          optionLabel="label"
          optionValue="value"
          styleClass="w-full"
        />

        <!-- Salon Name (owner only) -->
        @if (accountType === 'owner') {
          <p-floatlabel variant="on">
            <input
              pInputText
              id="reg-salon"
              formControlName="salonName"
              class="w-full"
            />
            <label for="reg-salon">Salon Name</label>
          </p-floatlabel>
        }

        <!-- Terms & conditions -->
        <div class="flex items-start gap-3">
          <p-checkbox
            [(ngModel)]="agreedToTerms"
            [ngModelOptions]="{ standalone: true }"
            [binary]="true"
            inputId="reg-terms"
          />
          <label for="reg-terms" class="text-sm text-zinc-600 dark:text-zinc-400 cursor-pointer leading-snug">
            I agree to the
            <a routerLink="/terms" class="text-emerald-600 hover:underline font-medium">Terms of Service</a>
            and
            <a routerLink="/privacy" class="text-emerald-600 hover:underline font-medium">Privacy Policy</a>
          </label>
        </div>

        <!-- Submit -->
        <p-button
          type="submit"
          label="Create Account"
          severity="success"
          styleClass="w-full justify-center"
          [loading]="isLoading()"
          [disabled]="!agreedToTerms"
        />

      </form>

      <!-- Login link -->
      <p class="text-center text-sm text-zinc-500 mt-8 mb-0">
        Already have an account?
        <a routerLink="/auth/login" class="text-emerald-600 font-semibold hover:underline ml-1">Sign in</a>
      </p>

    </div>
  </div>

</div>
