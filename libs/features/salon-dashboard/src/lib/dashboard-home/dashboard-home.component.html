<!-- Two-column flex layout: slim sidebar + flex-1 content -->
<div class="flex h-full overflow-hidden">

  <!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
  <lib-dashboard-sidebar
    [salonName]="salon()?.name ?? null"
    [userEmail]="userEmail()"
    [isExpanded]="isExpanded()"
    [showFranchise]="isFranchiseOwner()"
    (expanded)="isExpanded.set(true)"
    (collapsed)="isExpanded.set(false)"
    (logoutClicked)="logout()"
  />

  <!-- ── Main content area ──────────────────────────────────────────────── -->
  <main class="flex-1 overflow-y-auto bg-slate-100 dark:bg-zinc-950 p-4 md:p-8 transition-all duration-300"
        [ngClass]="mainMarginClass()">

    @if (isLoading()) {
      <div class="flex flex-col items-center justify-center gap-4 h-1/2 text-gray-500">
        <p-progressSpinner strokeWidth="3" animationDuration=".8s" [style]="{ width: '40px', height: '40px' }" />
        <span>Loading your dashboard…</span>
      </div>
    } @else if (loadError()) {
      <div class="flex flex-col items-center justify-center gap-4 h-1/2 text-gray-500 text-center">
        <i class="pi pi-exclamation-circle text-red-500 text-2xl"></i>
        <p>{{ loadError() }}</p>
        <p-button label="Retry" (onClick)="loadSalon()" />
      </div>
    } @else if (!isOwner()) {
      <div class="flex flex-col items-center justify-center gap-4 h-1/2 text-gray-500 text-center">
        <i class="pi pi-lock text-red-500 text-2xl"></i>
        <p>You do not have salon-owner access.</p>
      </div>
    } @else {
      @if (isFranchiseOwner() && franchiseBranches().length > 1) {
        <div class="mb-6 flex flex-wrap items-center justify-end gap-4">
          <lib-branch-selector
            [branches]="franchiseBranches()"
            [currentSalonId]="salon()?._id ?? null"
            (salonChanged)="onBranchChanged($event)"
          />
        </div>
      }
      <router-outlet />
    }

  </main>

</div>
