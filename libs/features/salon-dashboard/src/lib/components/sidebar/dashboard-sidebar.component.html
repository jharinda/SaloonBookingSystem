<aside
  class="flex flex-col items-center bg-slate-50 dark:bg-zinc-950 flex-shrink-0 transition-all duration-300 ease-in-out overflow-hidden fixed left-3 top-[4.75rem] h-[calc(100vh-5.5rem)] rounded-2xl border border-zinc-200 dark:border-zinc-700 z-40"
  [class.w-52]="isExpanded()"
  [class.w-16]="!isExpanded()"
  [class.shadow-\[0_0_20px_rgba\(16\,185\,129\,0\.2\)\,0_0_40px_rgba\(16\,185\,129\,0\.1\)\]]="isExpanded()"
  [class.shadow-\[0_0_15px_rgba\(16\,185\,129\,0\.12\)\,0_0_30px_rgba\(16\,185\,129\,0\.06\)\]]="!isExpanded()"
  (mouseenter)="expanded.emit()"
  (mouseleave)="collapsed.emit()"
>

  <!-- Logo block -->
  <!-- <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-emerald-500 mb-6 mt-2 flex-shrink-0">
    <span class="text-white font-bold text-lg">✂</span>
  </div> -->

  <!-- Salon avatar -->
  @if (salonName()) {
    <div class="flex flex-col items-center gap-1 pb-4 mb-2 border-b border-zinc-200 dark:border-zinc-800 w-full px-2 mt-2">
      <div class="flex items-center gap-2 w-full min-w-0 transition-all duration-300"
           [class.justify-center]="!isExpanded()"
           [class.justify-start]="isExpanded()">
        <div class="w-9 h-9 flex-shrink-0 rounded-lg bg-zinc-100 dark:bg-zinc-700 flex items-center justify-center text-xs font-bold text-emerald-600 dark:text-emerald-400">
          {{ salonName()!.charAt(0).toUpperCase() }}
        </div>
        <span class="text-sm font-semibold text-zinc-800 dark:text-zinc-100 truncate overflow-hidden transition-all duration-200 whitespace-nowrap"
              [class.opacity-100]="isExpanded()"
              [class.opacity-0]="!isExpanded()"
              [class.max-w-xs]="isExpanded()"
              [class.max-w-0]="!isExpanded()">{{ salonName() }}</span>
      </div>
    </div>
  }

  <!-- Icon nav -->
  <nav class="flex flex-col items-center gap-1 flex-1 w-full px-2 py-2">
    <a [routerLink]="'/salon-dashboard/overview'" routerLinkActive="active-nav-item" class="nav-icon-btn w-full px-3" pTooltip="Overview" tooltipPosition="right" [tooltipOptions]="{showDelay: 200}" [tooltipDisabled]="isExpanded()">
      <span class="flex-shrink-0 w-5 flex items-center justify-center"><i class="pi pi-home"></i></span>
      <span class="ml-3 text-sm font-medium whitespace-nowrap overflow-hidden transition-all duration-200"
            [class.opacity-100]="isExpanded()"
            [class.opacity-0]="!isExpanded()"
            [class.max-w-xs]="isExpanded()"
            [class.max-w-0]="!isExpanded()">Overview</span>
    </a>
    <a [routerLink]="'/salon-dashboard/bookings'" routerLinkActive="active-nav-item" class="nav-icon-btn w-full px-3" pTooltip="Appointments" tooltipPosition="right" [tooltipOptions]="{showDelay: 200}" [tooltipDisabled]="isExpanded()">
      <span class="flex-shrink-0 w-5 flex items-center justify-center relative">
        <i class="pi pi-calendar"></i>
        @if (newBookingsCount() > 0) {
          <span class="absolute -top-2 -right-2 min-w-[1rem] h-4 px-0.5 flex items-center justify-center rounded-full bg-emerald-500 text-white text-[0.6rem] font-bold leading-none">
            {{ newBookingsCount() > 99 ? '99+' : newBookingsCount() }}
          </span>
        }
      </span>
      <span class="ml-3 text-sm font-medium whitespace-nowrap overflow-hidden transition-all duration-200"
            [class.opacity-100]="isExpanded()"
            [class.opacity-0]="!isExpanded()"
            [class.max-w-xs]="isExpanded()"
            [class.max-w-0]="!isExpanded()">Appointments</span>
    </a>
    <a [routerLink]="'/salon-dashboard/services'" routerLinkActive="active-nav-item" class="nav-icon-btn w-full px-3" pTooltip="Services" tooltipPosition="right" [tooltipOptions]="{showDelay: 200}" [tooltipDisabled]="isExpanded()">
      <span class="flex-shrink-0 w-5 flex items-center justify-center"><i class="pi pi-wrench"></i></span>
      <span class="ml-3 text-sm font-medium whitespace-nowrap overflow-hidden transition-all duration-200"
            [class.opacity-100]="isExpanded()"
            [class.opacity-0]="!isExpanded()"
            [class.max-w-xs]="isExpanded()"
            [class.max-w-0]="!isExpanded()">Services</span>
    </a>
    <a [routerLink]="'/salon-dashboard/staff'" routerLinkActive="active-nav-item" class="nav-icon-btn w-full px-3" pTooltip="Staff" tooltipPosition="right" [tooltipOptions]="{showDelay: 200}" [tooltipDisabled]="isExpanded()">
      <span class="flex-shrink-0 w-5 flex items-center justify-center"><i class="pi pi-users"></i></span>
      <span class="ml-3 text-sm font-medium whitespace-nowrap overflow-hidden transition-all duration-200"
            [class.opacity-100]="isExpanded()"
            [class.opacity-0]="!isExpanded()"
            [class.max-w-xs]="isExpanded()"
            [class.max-w-0]="!isExpanded()">Staff</span>
    </a>
    <a [routerLink]="'/salon-dashboard/stations'" routerLinkActive="active-nav-item" class="nav-icon-btn w-full px-3" pTooltip="Stations" tooltipPosition="right" [tooltipOptions]="{showDelay: 200}" [tooltipDisabled]="isExpanded()">
      <span class="flex-shrink-0 w-5 flex items-center justify-center"><i class="pi pi-box"></i></span>
      <span class="ml-3 text-sm font-medium whitespace-nowrap overflow-hidden transition-all duration-200"
            [class.opacity-100]="isExpanded()"
            [class.opacity-0]="!isExpanded()"
            [class.max-w-xs]="isExpanded()"
            [class.max-w-0]="!isExpanded()">Stations</span>
    </a>
    <a [routerLink]="'/salon-dashboard/hours'" routerLinkActive="active-nav-item" class="nav-icon-btn w-full px-3" pTooltip="Working Hours" tooltipPosition="right" [tooltipOptions]="{showDelay: 200}" [tooltipDisabled]="isExpanded()">
      <span class="flex-shrink-0 w-5 flex items-center justify-center"><i class="pi pi-clock"></i></span>
      <span class="ml-3 text-sm font-medium whitespace-nowrap overflow-hidden transition-all duration-200"
            [class.opacity-100]="isExpanded()"
            [class.opacity-0]="!isExpanded()"
            [class.max-w-xs]="isExpanded()"
            [class.max-w-0]="!isExpanded()">Working Hours</span>
    </a>
    <a [routerLink]="'/salon-dashboard/reviews'" routerLinkActive="active-nav-item" class="nav-icon-btn w-full px-3" pTooltip="Reviews" tooltipPosition="right" [tooltipOptions]="{showDelay: 200}" [tooltipDisabled]="isExpanded()">
      <span class="flex-shrink-0 w-5 flex items-center justify-center"><i class="pi pi-star"></i></span>
      <span class="ml-3 text-sm font-medium whitespace-nowrap overflow-hidden transition-all duration-200"
            [class.opacity-100]="isExpanded()"
            [class.opacity-0]="!isExpanded()"
            [class.max-w-xs]="isExpanded()"
            [class.max-w-0]="!isExpanded()">Reviews</span>
    </a>
    <a [routerLink]="'/salon-dashboard/settings'" routerLinkActive="active-nav-item" class="nav-icon-btn w-full px-3" pTooltip="Settings" tooltipPosition="right" [tooltipOptions]="{showDelay: 200}" [tooltipDisabled]="isExpanded()">
      <span class="flex-shrink-0 w-5 flex items-center justify-center"><i class="pi pi-cog"></i></span>
      <span class="ml-3 text-sm font-medium whitespace-nowrap overflow-hidden transition-all duration-200"
            [class.opacity-100]="isExpanded()"
            [class.opacity-0]="!isExpanded()"
            [class.max-w-xs]="isExpanded()"
            [class.max-w-0]="!isExpanded()">Settings</span>
    </a>
  </nav>

  <!-- Footer: logout -->
  <div class="flex items-center gap-2 pb-3 border-t border-zinc-200 dark:border-zinc-800 w-full pt-3 px-2 min-w-0">
    <p-button
      icon="pi pi-sign-out"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      (onClick)="logout()"
      aria-label="Sign out"
      styleClass="text-zinc-400 flex-shrink-0"
    />
    <span class="text-xs text-zinc-400 truncate overflow-hidden transition-all duration-200"
          [class.opacity-100]="isExpanded()"
          [class.opacity-0]="!isExpanded()"
          [class.w-auto]="isExpanded()"
          [class.w-0]="!isExpanded()" class="text-zinc-500 dark:text-zinc-400">{{ userEmail() }}</span>
  </div>

</aside>
