<div class="wizard-container">
  <!-- Loading State -->
  @if (loading()) {
    <div class="wizard-state wizard-state--loading">
      <p-progressspinner strokeWidth="4" />
      <p>Loading salon details...</p>
    </div>
  }

  <!-- Error State -->
  @else if (error()) {
    <div class="wizard-state wizard-state--error">
      <i class="pi pi-exclamation-circle wizard-state__icon"></i>
      <p class="wizard-state__message">{{ error() }}</p>
      <p-button label="Back to Discover" icon="pi pi-search" (onClick)="goToDiscover()" />
    </div>
  }

  <!-- Booking Wizard -->
  @else if (salon()) {
    <!-- Salon Header -->
    <div class="wizard-header">
      <div class="salon-info">
        <div class="salon-info__image">
          @if (salon()!.images && salon()!.images!.length > 0) {
            <img [src]="salon()!.images![0].url" [alt]="salon()!.name">
          } @else {
            <i class="pi pi-building"></i>
          }
        </div>
        <div class="salon-info__details">
          <h1 class="salon-info__name">{{ salon()!.name }}</h1>
          <p class="salon-info__address">
            <i class="pi pi-map-marker"></i>
            {{ salon()!.address.city }}
          </p>
        </div>
      </div>
    </div>

    <!-- PrimeNG Stepper -->
    <p-stepper #stepper class="booking-stepper" [value]="currentStep()">
      <p-step-list>
        <p-step [value]="1">Services</p-step>
        <p-step [value]="2">Date & Time</p-step>
        <p-step [value]="3">Stylist</p-step>
        <p-step [value]="4">Confirm</p-step>
      </p-step-list>

      <p-step-panels>
        <!-- Step 1: Service Selection -->
        <p-step-panel [value]="1">
          <ng-template #content>
            <lib-service-selection-step />

            <div class="step-actions">
              <p-button
                label="Cancel"
                icon="pi pi-times"
                severity="secondary"
                (onClick)="goToDiscover()"
              />
              <p-button
                label="Next"
                icon="pi pi-arrow-right"
                iconPos="right"
                [disabled]="!isStep1Valid()"
                (onClick)="goToNextStep()"
              />
            </div>
          </ng-template>
        </p-step-panel>

        <!-- Step 2: Date & Time -->
        <p-step-panel [value]="2">
          <ng-template #content>
            <lib-datetime-selection-step />

            <div class="step-actions">
              <p-button
                label="Back"
                icon="pi pi-arrow-left"
                severity="secondary"
                (onClick)="goToPreviousStep()"
              />
              <p-button
                label="Next"
                icon="pi pi-arrow-right"
                iconPos="right"
                [disabled]="!isStep2Valid()"
                (onClick)="goToNextStep()"
              />
            </div>
          </ng-template>
        </p-step-panel>

        <!-- Step 3: Stylist Selection -->
        <p-step-panel [value]="3">
          <ng-template #content>
            <lib-stylist-selection-step />

            <div class="step-actions">
              <p-button
                label="Back"
                icon="pi pi-arrow-left"
                severity="secondary"
                (onClick)="goToPreviousStep()"
              />
              <p-button
                label="Next"
                icon="pi pi-arrow-right"
                iconPos="right"
                (onClick)="goToNextStep()"
              />
            </div>
          </ng-template>
        </p-step-panel>

        <!-- Step 4: Confirmation -->
        <p-step-panel [value]="4">
          <ng-template #content>
            <lib-booking-confirmation-step
              (bookingCreated)="onBookingCreated($event)"
            />

            <div class="step-actions">
              <p-button
                label="Back"
                icon="pi pi-arrow-left"
                severity="secondary"
                (onClick)="goToPreviousStep()"
              />
            </div>
          </ng-template>
        </p-step-panel>
      </p-step-panels>
    </p-stepper>
  }
</div>
