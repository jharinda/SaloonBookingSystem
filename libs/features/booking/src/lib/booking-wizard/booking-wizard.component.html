<div class="wizard-container">
  <!-- Loading State -->
  @if (loading()) {
    <div class="wizard-state wizard-state--loading">
      <p-progressspinner strokeWidth="4" />
      <p>Loading salon details...</p>
    </div>
  }

  <!-- Error State -->
  @else if (error()) {
    <div class="wizard-state wizard-state--error">
      <i class="pi pi-exclamation-circle wizard-state__icon"></i>
      <p class="wizard-state__message">{{ error() }}</p>
      <button pButton (click)="goToDiscover()">
        <i class="pi pi-search"></i>
        Back to Discover
      </button>
    </div>
  }

  <!-- Booking Wizard -->
  @else if (salon()) {
    <!-- Salon Header -->
    <div class="wizard-header">
      <div class="salon-info">
        <div class="salon-info__image">
          @if (salon()!.images && salon()!.images!.length > 0) {
            <img [src]="salon()!.images![0].url" [alt]="salon()!.name">
          } @else {
            <i class="pi pi-building"></i>
          }
        </div>
        <div class="salon-info__details">
          <h1 class="salon-info__name">{{ salon()!.name }}</h1>
          <p class="salon-info__address">
            <i class="pi pi-map-marker"></i>
            {{ salon()!.address.city }}
          </p>
        </div>
      </div>
    </div>

    <!-- PrimeNG Stepper -->
    <p-stepper #stepper class="booking-stepper" [linear]="true" [value]="currentStep()" (valueChange)="onActiveStepChange($event)">
      <!-- Step 1: Service Selection -->
      <p-step-panel>
        <ng-template pTemplate="header">
          <span class="step-label">
            <i class="pi pi-scissors"></i>
            <span class="step-label__text">Services</span>
          </span>
        </ng-template>
        <ng-template pTemplate="content">
          <lib-service-selection-step />

          <div class="step-actions">
            <button pButton severity="secondary" (click)="goToDiscover()">
              <i class="pi pi-times"></i>
              Cancel
            </button>
            <button
              pButton
              [disabled]="!isStep1Valid()"
              (click)="goToNextStep()"
            >
              Next
              <i class="pi pi-arrow-right"></i>
            </button>
          </div>
        </ng-template>
      </p-step-panel>

      <!-- Step 2: Stylist Selection -->
      <p-step-panel>
        <ng-template pTemplate="header">
          <span class="step-label">
            <i class="pi pi-user"></i>
            <span class="step-label__text">Stylist</span>
          </span>
        </ng-template>
        <ng-template pTemplate="content">
          <lib-stylist-selection-step />

          <div class="step-actions">
            <button pButton severity="secondary" (click)="goToPreviousStep()">
              <i class="pi pi-arrow-left"></i>
              Back
            </button>
            <button
              pButton
              (click)="goToNextStep()"
            >
              Next
              <i class="pi pi-arrow-right"></i>
            </button>
          </div>
        </ng-template>
      </p-step-panel>

      <!-- Step 3: Date & Time -->
      <p-step-panel>
        <ng-template pTemplate="header">
          <span class="step-label">
            <i class="pi pi-calendar"></i>
            <span class="step-label__text">Date & Time</span>
          </span>
        </ng-template>
        <ng-template pTemplate="content">
          <lib-datetime-selection-step />

          <div class="step-actions">
            <button pButton severity="secondary" (click)="goToPreviousStep()">
              <i class="pi pi-arrow-left"></i>
              Back
            </button>
            <button
              pButton
              [disabled]="!isStep3Valid()"
              (click)="goToNextStep()"
            >
              Next
              <i class="pi pi-arrow-right"></i>
            </button>
          </div>
        </ng-template>
      </p-step-panel>

      <!-- Step 4: Confirmation -->
      <p-step-panel>
        <ng-template pTemplate="header">
          <span class="step-label">
            <i class="pi pi-check-circle"></i>
            <span class="step-label__text">Confirm</span>
          </span>
        </ng-template>
        <ng-template pTemplate="content">
          <lib-booking-confirmation-step
            (bookingCreated)="onBookingCreated($event)"
          />

          <div class="step-actions">
            <button pButton severity="secondary" (click)="goToPreviousStep()">
              <i class="pi pi-arrow-left"></i>
              Back
            </button>
          </div>
        </ng-template>
      </p-step-panel>
    </p-stepper>
  }
</div>
