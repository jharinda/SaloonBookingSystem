        value: '6379'
      - key: INTERNAL_TOKEN
        sync: false
      - key: AUTH_SERVICE_URL
        sync: false
      - key: SALON_SERVICE_URL
        sync: false
      - key: GATEWAY_URL
        sync: false

  - type: pserv
    name: snapsalon-calendar-service
    runtime: docker
    dockerfilePath: apps/calendar-service/Dockerfile
