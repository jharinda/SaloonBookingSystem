<!-- ═══════════════════════════════════════════════════
     SnapSalon — PrimeNG Menubar top navigation
     Sticky header with Tailwind positioning utilities
     ═══════════════════════════════════════════════════ -->
<header class="sticky top-0 z-50 px-3 pt-3">
  <p-menubar [model]="menuItems()" styleClass="snapsalon-menubar rounded-2xl border px-4">

    <!-- ── Logo (start slot) ──────────────────────────────── -->
    <ng-template #start>
      <a routerLink="/discover"
         class="flex items-center gap-2 no-underline mr-6"
         aria-label="SnapSalon home">
        <div class="flex items-center justify-center w-8 h-8 rounded-xl bg-emerald-500 flex-shrink-0">
          <span class="text-white font-bold text-base leading-none">✂</span>
        </div>
        <span class="font-bold text-lg tracking-wide">SnapSalon</span>
      </a>
    </ng-template>

    <!-- ── Auth area (end slot) ──────────────────────────── -->
    <ng-template #end>
      <div class="flex items-center gap-2">

        <!-- Notification bell (salon owners / admins only) -->
        <app-notification-bell />

        <!-- Dark / light mode toggle -->
        <p-button
          [icon]="isDark() ? 'pi pi-sun' : 'pi pi-moon'"
          [text]="true"
          [rounded]="true"
          severity="secondary"
          size="small"
          [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
          (onClick)="toggleDarkMode()"
        />

        <!-- Guest: Login + Register buttons -->
        @if (!isLoggedIn()) {
          <p-button
            label="Login"
            severity="secondary"
            [outlined]="true"
            size="small"
            (onClick)="router.navigate(['/auth/login'])"
          />
          <p-button
            label="Register"
            size="small"
            (onClick)="router.navigate(['/auth/register'])"
          />
        }

        <!-- Logged-in: avatar bubble + user dropdown -->
        @if (isLoggedIn()) {
          <p-menu #userMenu [model]="userMenuItems()" [popup]="true" />
          <button
            type="button"
            class="avatar-btn"
            (click)="userMenu.toggle($event)"
            aria-label="Open user menu"
          >
            <span class="avatar-circle">{{ userInitial() }}</span>
          </button>
        }

      </div>
    </ng-template>
  </p-menubar>
</header>
